<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #dedcdc;
            color: #111;
        }

        .quiz-container {
            min-height: 100vh;
            padding: 100px 45px 0;
            background-color: white;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 20px 30px 0;
            
        }

        .quiz-header h3 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .quiz-number {
            background-color: #000;
            color: white;
            width: 27px;
            height: 27px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        .quiz-content {
            max-width: 1100px;
        }

        .quiz-content p {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .quiz-content h1 {
            font-size: 55px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            font-family: Coolvetica, sans-serif;
        }

        .answer-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .answer-btn {
            min-width: 120px;
            height: 55px;
            padding: 2px 12px;
            border-radius: 5px;
            background-color: white;
            border: 1px solid #aaa;
            font-size: 30px;
            font-weight: 600;
        }

        .answer-btn:hover {
            background-color: #090909;
            color: white;
        }

        .nadhif-image {
            position: absolute;
            right: 20px;
            bottom: 0;
            width: 320px;
            height: auto;
        }

        .decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 2px solid #111;
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
        }

        .particle.square {
            border-radius: 2px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.25;
            }
            50% {
                transform: translateY(-25px) rotate(180deg);
                opacity: 0.8;
            }
        }

        footer {
            background-color: #ddd;
            text-align: center;
            padding: 6px;
            margin-top: 10px;
        }
        
        footer p {
            font-size: 14px;
            margin: 0;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="quiz-header">
        <h3>Quiz</h3>
        <div class="quiz-number">
            3
        </div>
    </div>

    <div class="quiz-container">
        <div class="decorations" id="decorations"></div>
        <div class="quiz-content">
            <p>Jawab dengan teliti dan jujur, tekan tombol jawaban yang benar untuk melanjutkan ke quiz berikutnya.</p>
            <h1>Apa hal yang paling Nadhif minati sekarang?</h1>
            <hr>
            <div class="answer-buttons">
                <button
                    class="answer-btn"
                    onclick="checkAnswer('Jogging')">
                    Jogging
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Debat')">
                    Debat
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Menulis')">
                    Menulis
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Bernyanyi')">
                    Bernyanyi
                </button>
            </div>
        </div>
        <img src="nadip3.png" alt="Nadhif" class="nadhif-image">
    </div>

    <script>
        const decorations = document.getElementById("decorations")
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement("div")
            particle.classList.add("particle")

            if (i % 2 === 0) {
                particle.classList.add("square")
            }

            particle.style.left = Math.random() * 100 + "%"
            particle.style.top = Math.random() * 100 + "%"
            particle.style.animationDelay = Math.random() * 3 + "s"
            particle.style.animationDuration = 3 + Math.random() * 3 + "s"
            decorations.appendChild(particle)
        }

        function checkAnswer(answer) {
            if (answer === "Debat") {
                Swal.fire({
                    icon: "success",
                    title: "Jawaban Benar!",
                    text: "Kamu berhasil menjawab pertanyaan ini.",
                    confirmButtonText: "Selanjutnya",
                    confirmButtonColor: "#000"
                }).then((result) => {

                    if (result.isConfirmed) {
                        window.location.href = "quiztuntung.html"
                    }

                })
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Jawaban Salah!",
                    text: "Coba cari lagi jawaban yang benar.",
                    confirmButtonText: "Coba Lagi",
                    confirmButtonColor: "#000"
                })
            }
        }
    </script>
    <footer>
        <p>Muhammad Nadhif Helmy Nadhif</p>
    </footer>
</body>
</html>
