<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Coolvetica, sans-serif;
            background-color: white;
            color: #111;
        }

        .quiz-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="decorations" id="decorations"></div>
    <div class="quiz-container">
        <div class="quiz-box">
            <img src="nadippixel.png"alt="Nadhif" class="quiz-image">
            <h1>Sudah Mengenal Nadhif dengan Baik?</h1>
            <p>Jika sudah, mari kita uji pengetahuanmu melalui quiz. Apakah kamu siap?</p>
            <div class="quiz-buttons">
                <button
                    class="btn btn-belum"
                    onclick="belumSiap()">
                    Belum
                </button>
                <button
                    class="btn btn-sudah"
                    onclick="sudahSiap()">
                    Sudah
                </button>
            </div>
        </div>
    </div>
</body>
</html>
