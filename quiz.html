<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @font-face {
            font-family: Coolvetica;
            src: url("fonts/Coolvetica.otf");
        }

        body {
            font-family: Coolvetica, sans-serif;
            background-color: white;
            color: #111;
        }

        .quiz-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .quiz-box {
            width: 100%;
            max-width: 1300px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .quiz-image {
            width: 200px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
            position: relative;
            animation: characterFloat 3s ease-in-out infinite;
        }

        .quiz-box h1 {
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 5px;
            position: relative;
        }

        .quiz-box p {
            font-size: 20px;
            color: #555;
            margin-bottom: 12px;
            position: relative;
        }

        .quiz-buttons {
            display: flex;
            gap: 24px;
            position: relative;
        }

        .btn-belum {
            background-color: white;
            color: #111;
            border: 1px solid #aaa;
        }

        .btn-belum:hover {
            background-color: #000;
            color: white;
            border: 1px solid #000;
        }

        .btn-sudah {
            background-color: white;
            color: #111;
            border: 1px solid #aaa;
        }

        .btn-sudah:hover {
            background-color: #000;
            color: white;
            border: 1px solid #000;
        }

        .decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 2px solid #111;
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
        }

        .particle.square {
            border-radius: 2px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.25;
            }
            50% {
                transform: translateY(-25px) rotate(180deg);
                opacity: 0.8;
            }
        }

        @keyframes characterFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 768px) {
        .quiz-container {
            padding: 20px;
        }

        .quiz-box {
            min-height: 100vh;
            padding: 25px;
        }

        .quiz-image {
            width: 170px;
            margin-bottom: 15px;
        }

        .quiz-box h1 {
            font-size: 45px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .quiz-box p {
            font-size: 15px;
            line-height: 1.5;
            max-width: 500px;
        }

        .quiz-buttons {
            gap: 18px;
        }

        .btn-belum,
        .btn-sudah {
            width: 80px;
            height: 42px;
            font-size: 17px;
        }

        .particle {
            width: 7px;
            height: 7px;
        }
    }

    @media (max-width: 440px) {

        .quiz-container {
            padding: 10px;
        }

        .quiz-box {
            min-height: 100vh;
            padding: 20px 15px;
        }

        .quiz-image {
            width: 140px;
            margin-bottom: 12px;
        }

        .quiz-box h1 {
            font-size: 30px;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .quiz-box p {
            font-size: 12px;
            line-height: 1.5;
            max-width: 320px;
        }

        .quiz-buttons {
            gap: 12px;
        }

        .btn-belum,
        .btn-sudah {
            width: 70px;
            height: 38px;
            font-size: 14px;
        }

        .particle {
            width: 6px;
            height: 6px;
            border-width: 1px;
        }
    }
    </style>
</head>
<body>
    <div class="decorations" id="decorations"></div>
    <div class="quiz-container">
        <div class="quiz-box">
            <img src="nadippixel.png"alt="Nadhif" class="quiz-image">
            <h1>Sudah Mengenal Nadhif dengan Baik?</h1>
            <p>Jika sudah, mari kita uji pengetahuanmu melalui quiz. Apakah kamu siap?</p>
            <div class="quiz-buttons">
                <button
                    class="btn btn-belum"
                    onclick="belumSiap()">
                    Belum
                </button>
                <button
                    class="btn btn-sudah"
                    onclick="sudahSiap()">
                    Sudah
                </button>
            </div>
        </div>
    </div>
    <script>
        function belumSiap() {
            Swal.fire({
                icon: "question",
                title: "Kamu belum siap?",
                text: "Apakah kamu yakin ingin kembali ke halaman Home?",
                showCancelButton: true,
                confirmButtonText: "Ya, kembali",
                cancelButtonText: "Tetap di sini",
                confirmButtonColor: "#000",
                cancelButtonColor: "#000",
                color: "#111"
            }).then((result) => {

                if (result.isConfirmed) {
                    window.location.href = "index.html"
                }
            })
        }

        function sudahSiap() {
            Swal.fire({
                icon: "question",
                title: "Apakah Kamu Yakin?",
                text: "Dengan menekan tombol 'Ya, lanjut', kamu akan diarahkan ke halaman quiz. Apakah kamu yakin ingin melanjutkan?",
                showCancelButton: true,
                confirmButtonText: "Ya, lanjut",
                cancelButtonText: "Tetap di sini",
                confirmButtonColor: "#000",
                cancelButtonColor: "#000",
                color: "#111"
            }).then((result) => {

                if (result.isConfirmed) {
                    window.location.href = "quiz1.html"
                }
            })
        }

        const decorations = document.getElementById("decorations")
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement("div")
            particle.classList.add("particle")

            if (i % 2 === 0) {
                particle.classList.add("square")
            }

            particle.style.left = Math.random() * 100 + "%"
            particle.style.top = Math.random() * 100 + "%"
            particle.style.animationDelay = Math.random() * 3 + "s"
            particle.style.animationDuration = 3 + Math.random() * 3 + "s"
            decorations.appendChild(particle)
        }
    </script>
</body>
</html>
