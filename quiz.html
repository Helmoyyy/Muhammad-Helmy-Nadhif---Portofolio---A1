<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Coolvetica, sans-serif;
            background-color: white;
            color: #111;
        }

        .quiz-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .quiz-box {
            width: 100%;
            max-width: 1300px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .quiz-image {
            width: 200px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
            position: relative;
        }

        .quiz-box h1 {
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 5px;
            position: relative;
        }

        .quiz-box p {
            font-size: 20px;
            color: #555;
            margin-bottom: 12px;
            position: relative;
        }

        .quiz-buttons {
            display: flex;
            gap: 24px;
            position: relative;
        }

        .btn-belum {
            background-color: white;
            color: #111;
            border: 1px solid #aaa;
        }

        .btn-belum:hover {
            background-color: #000;
            color: white;
            border: 1px solid #000;
        }

        .btn-sudah {
            background-color: white;
            color: #111;
            border: 1px solid #aaa;
        }

        .btn-sudah:hover {
            background-color: #000;
            color: white;
            border: 1px solid #000;
        }

        



    </style>
</head>
<body>
    <div class="decorations" id="decorations"></div>
    <div class="quiz-container">
        <div class="quiz-box">
            <img src="nadippixel.png"alt="Nadhif" class="quiz-image">
            <h1>Sudah Mengenal Nadhif dengan Baik?</h1>
            <p>Jika sudah, mari kita uji pengetahuanmu melalui quiz. Apakah kamu siap?</p>
            <div class="quiz-buttons">
                <button
                    class="btn btn-belum"
                    onclick="belumSiap()">
                    Belum
                </button>
                <button
                    class="btn btn-sudah"
                    onclick="sudahSiap()">
                    Sudah
                </button>
            </div>
        </div>
    </div>
    <script>
        function belumSiap() {
            Swal.fire({
                icon: "question",
                title: "Kamu belum siap?",
                text: "Apakah kamu yakin ingin kembali ke halaman Home?",
                showCancelButton: true,
                confirmButtonText: "Ya, kembali",
                cancelButtonText: "Tetap di sini",
                confirmButtonColor: "#000",
                cancelButtonColor: "#000",
                color: "#111"
            }).then((result) => {

                if (result.isConfirmed) {
                    window.location.href = "beranda.html"
                }
            })
        }

        function sudahSiap() {
            Swal.fire({
                icon: "question",
                title: "Apakah Kamu Yakin?",
                text: "Dengan menekan tombol 'Ya, lanjut', kamu akan diarahkan ke halaman quiz. Apakah kamu yakin ingin melanjutkan?",
                showCancelButton: true,
                confirmButtonText: "Ya, lanjut",
                cancelButtonText: "Tetap di sini",
                confirmButtonColor: "#000",
                cancelButtonColor: "#000",
                color: "#111"
            }).then((result) => {

                if (result.isConfirmed) {
                    window.location.href = "quiz1.html"
                }
            })
        }
    </script>
</body>
</html>
