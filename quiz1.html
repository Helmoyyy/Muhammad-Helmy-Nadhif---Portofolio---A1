<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: white;
            color: #111;
        }

        .quiz-container {
            min-height: 100vh;
            padding: 100px 45px 0;
            background-color: white;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 20px 30px 0;
        }

        .quiz-header h3 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .quiz-number {
            background-color: #000;
            color: white;
            width: 27px;
            height: 27px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        .quiz-content {
            max-width: 1100px;
        }

        .quiz-content p {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .quiz-content h1 {
            font-size: 55px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            font-family: Coolvetica, sans-serif;
        }

        .answer-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .answer-btn {
            min-width: 120px;
            height: 55px;
            padding: 2px 12px;
            border-radius: 5px;
            background-color: white;
            border: 1px solid #aaa;
            font-size: 30px;
            font-weight: 600;
        }

        .answer-btn:hover {
            background-color: #090909;
            color: white;
        }
    </style>
</head>

<body>
    <div class="quiz-header">
        <h3>Quiz</h3>
        <div class="quiz-number">
            1
        </div>
    </div>

    <div class="quiz-container">
        <div class="decorations" id="decorations"></div>
        <div class="quiz-content">
            <p>Jawab dengan teliti dan jujur, tekan tombol jawaban yang benar untuk melanjutkan ke quiz berikutnya.</p>
            <h1>Apa Salah Satu Makanan Kesukaan Nadhif?</h1>
            <hr>
            <div class="answer-buttons">
                <button
                    class="answer-btn"
                    onclick="checkAnswer('Nasi Padang')">
                    Nasi Padang
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Gado-Gado')">
                    Gado-Gado
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Sate')">
                    Sate
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('Bakso')">
                    Bakso
                </button>
            </div>
        </div>
    </div>

    <script>
        function checkAnswer(answer) {
            if (answer === "Nasi Padang") {
                Swal.fire({
                    icon: "success",
                    title: "Jawaban Benar!",
                    text: "Kamu berhasil menjawab pertanyaan ini.",
                    confirmButtonText: "Quiz Selanjutnya",
                    confirmButtonColor: "#000"
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "quiz2.html"
                    }
                })
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Jawaban Salah!",
                    text: "Coba cari lagi jawaban yang benar.",
                    confirmButtonText: "Coba Lagi",
                    confirmButtonColor: "#000"
                })
            }
        }
    </script>
</body>
