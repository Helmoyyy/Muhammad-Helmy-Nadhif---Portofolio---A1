<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadhif's Profile - Quiz 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @font-face {
            font-family: Coolvetica;
            src: url("fonts/Coolvetica.otf");
        }
        
        body {
            background-color: #dedcdc;
            color: #111;
            font-family: Coolvetica, sans-serif;
        }

        .quiz-container {
            min-height: 100vh;
            padding: 100px 45px 0;
            background-color: white;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 20px 30px 0;
            
        }

        .quiz-header h3 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .quiz-number {
            background-color: #000;
            color: white;
            width: 27px;
            height: 27px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        .quiz-content {
            max-width: 1100px;
        }

        .quiz-content p {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .quiz-content h1 {
            font-size: 55px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            font-family: Coolvetica, sans-serif;
        }

        .answer-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .answer-btn {
            min-width: 120px;
            height: 55px;
            padding: 2px 12px;
            border-radius: 5px;
            background-color: white;
            border: 1px solid #aaa;
            font-size: 30px;
            font-weight: 600;
        }

        .answer-btn:hover {
            background-color: #090909;
            color: white;
        }

        .nadhif-image {
            position: absolute;
            right: 20px;
            bottom: 0;
            width: 320px;
            height: auto;
        }

        .decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 2px solid #111;
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
        }

        .particle.square {
            border-radius: 2px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.25;
            }
            50% {
                transform: translateY(-25px) rotate(180deg);
                opacity: 0.8;
            }
        }
        
        footer {
            background-color: #ddd;
            text-align: center;
            padding: 6px;
            margin-top: 10px;
        }
        
        footer p {
            font-size: 14px;
            margin: 0;
            color: #555;
        }

        @media (max-width: 768px) {
            .quiz-header {
                padding: 15px 25px 0;
                margin-bottom: 15px;
            }

            .quiz-header h3 {
                font-size: 16px;
            }

            .quiz-number {
                width: 25px;
                height: 25px;
                font-size: 11px;
            }

            .quiz-container {
                min-height: calc(100vh - 60px);
                padding: 50px 30px 180px;
            }

            .quiz-content {
                max-width: 100%;
            }

            .quiz-content p {
                font-size: 15px;
                line-height: 1.5;
            }

            .quiz-content h1 {
                font-size: 40px;
                line-height: 1.2;
            }

            .answer-buttons {
                gap: 12px;
            }

            .answer-btn {
                min-width: 110px;
                height: 48px;
                padding: 2px 10px;
                font-size: 22px;
            }

            .nadhif-image {
                width: 400px;
                right: 20px;
                bottom: 0;
            }

            footer {
                padding: 8px;
            }

            footer p {
                font-size: 12px;
            }

            .particle {
                width: 7px;
                height: 7px;
                border-width: 1px;
            }
        }

        @media (max-width: 440px) {
            .quiz-header {
                padding: 12px 15px 0;
                margin-bottom: 10px;
            }

            .quiz-header h3 {
                font-size: 14px;
            }

            .quiz-number {
                width: 23px;
                height: 23px;
                font-size: 10px;
            }

            .quiz-container {
                min-height: calc(100vh - 50px);
                padding: 35px 15px 145px;
            }

            .quiz-content {
                max-width: 100%;
            }

            .quiz-content p {
                font-size: 11px;
                line-height: 1.5;
                margin-bottom: 8px;
            }

            .quiz-content h1 {
                font-size: 28px;
                line-height: 1.2;
                margin-bottom: 8px;
            }

            .answer-buttons {
                gap: 8px;
            }

            .answer-btn {
                min-width: 90px;
                height: 42px;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 16px;
            }

            .nadhif-image {
                width: 300px;
                right: 5px;
                bottom: 0;
            }

            footer {
                padding: 7px;
                margin-top: 5px;
            }

            footer p {
                font-size: 10px;
            }

            .particle {
                width: 6px;
                height: 6px;
                border-width: 1px;
            }
        }
    </style>
</head>

<body>
    <div class="quiz-header">
        <h3>Quiz</h3>
        <div class="quiz-number">
            2
        </div>
    </div>

    <div class="quiz-container">
        <div class="decorations" id="decorations"></div>
        <div class="quiz-content">
            <p>Jawab dengan teliti dan jujur, tekan tombol jawaban yang benar untuk melanjutkan ke quiz berikutnya.</p>
            <h1>Dimana Nadhif bersekolah ketika berada di bangku Sekolah Dasar?</h1>
            <hr>
            <div class="answer-buttons">
                <button
                    class="answer-btn"
                    onclick="checkAnswer('SDN 2 Palangkaraya')">
                    SDN 2 Palangkaraya
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('SD Islam Nahdlatul Ulama')">
                    SD Islam Nahdlatul Ulama
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('SDN Mendawai 2 Sukamara')">
                    SDN Mendawai 2 Sukamara
                </button>

                <button
                    class="answer-btn"
                    onclick="checkAnswer('SDIT Al-Qonita')">
                    SDIT Al-Qonita
                </button>
            </div>
        </div>
        <img src="nadip2.png" alt="Nadhif" class="nadhif-image">
    </div>

    <script>
        const decorations = document.getElementById("decorations")
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement("div")
            particle.classList.add("particle")

            if (i % 2 === 0) {
                particle.classList.add("square")
            }

            particle.style.left = Math.random() * 100 + "%"
            particle.style.top = Math.random() * 100 + "%"
            particle.style.animationDelay = Math.random() * 3 + "s"
            particle.style.animationDuration = 3 + Math.random() * 3 + "s"
            decorations.appendChild(particle)
        }

        function checkAnswer(answer) {
            if (answer === "SDN Mendawai 2 Sukamara") {
                Swal.fire({
                    icon: "success",
                    title: "Jawaban Benar!",
                    text: "Kamu berhasil menjawab pertanyaan ini.",
                    confirmButtonText: "Quiz Selanjutnya",
                    confirmButtonColor: "#000"
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "quiz3.html"
                    }

                })
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Jawaban Salah!",
                    text: "Coba cari lagi jawaban yang benar.",
                    confirmButtonText: "Coba Lagi",
                    confirmButtonColor: "#000"
                })
            }
        }
    </script>
    <footer>
        <p>Muhammad Nadhif Helmy Nadhif</p>
    </footer>
</body>
</html>
